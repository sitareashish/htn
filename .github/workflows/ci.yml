name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gcc-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-13 cmake ninja-build
      - name: Configure
        run: CC=gcc-13 cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  gcc-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-13 cmake ninja-build
      - name: Configure
        run: CC=gcc-13 cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Asan
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-17 cmake ninja-build
      - name: Configure
        run: CC=clang-17 cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-17 cmake ninja-build
      - name: Configure
        run: CC=clang-17 cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Asan
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
